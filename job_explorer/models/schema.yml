models:
  - name: postings
    description: "Base model. One row per clean scrape of a job posting (error rows removed)."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: "Posting ID from the source. Repeats when a job is scraped again."

  - name: platform_share
    description: "Postings per job platform, with the 'via ' prefix removed."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: platform
        description: "Job platform name without the 'via ' prefix."

  - name: salary_posts
    description: "Postings that show a salary, with the pay period parsed from the text."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: "Posting ID of a posting that shows a salary."

  - name: remote_by_role
    description: "Percent of postings that are remote, per role."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: role
        description: "The role searched for: Data Analyst, Data Engineer or Data Scientist."

  - name: top_skills
    description: "Distinct jobs that mention each skill keyword, read straight from the skills source."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: skill_keyword
        description: "Skill keyword, for example sql or python."
  - name: role_scorecard
    description: "One row per role. Compare postings, remote share and salary share before you pick a role to chase."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: role
        description: "The role searched for: Data Analyst, Data Engineer or Data Scientist."
  - name: skills_by_role
    description: "one row per role and skill keyword"
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: role
        description: "The role searched for: Data Analyst, Data Engineer or Data Scientist."
      - name: skill_keyword
        description: "The keyword searched for"
